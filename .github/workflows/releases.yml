name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            format: gztar
            mode: onefile
            strip: --strip
          - os: windows-latest
            name: Windows
            format: zip
            mode: onedir
            strip: ''
          - os: macos-latest
            name: macOS
            format: gztar
            mode: onefile
            strip: --strip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --${{ matrix.mode }} ${{ matrix.strip }} --exclude-module tkinter --exclude-module unittest --exclude-module pydoc --exclude-module sqlite3 --name ValheimSharedWorlds main.py

      - name: Package
        run: |
          APP="ValheimSharedWorlds-${{ matrix.name }}"
          PKG="package/$APP"

          mkdir -p "$PKG/config"
          cp config/settings_template.json "$PKG/config/settings.json"

          if [ "${{ matrix.mode }}" = "onedir" ]; then
            cp -r dist/ValheimSharedWorlds/. "$PKG/"
          else
            cp dist/ValheimSharedWorlds "$PKG/"
          fi

          python -c "import shutil; shutil.make_archive('$APP', '${{ matrix.format }}', root_dir='package', base_dir='$APP')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValheimSharedWorlds-${{ matrix.name }}
          path: ValheimSharedWorlds-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
